name: Extract PromoAngol Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract architecture package
        run: |
          rm -rf _extracted_architecture
          mkdir -p _extracted_architecture
          unzip -o promoangol-cloudflare-architecture.zip -d _extracted_architecture

      - name: Extract Stitch source
        run: |
          rm -rf _extracted_stitch
          mkdir -p _extracted_stitch
          unzip -o stitch_pixel_faithful_website_cloner.zip -d _extracted_stitch

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _extracted_architecture _extracted_stitch
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: extract PromoAngol source packages"
          git push
